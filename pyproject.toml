[project]
name = "dermtrack-agent"
version = "0.1.0"
description = "Agentic multimodal skin-care assistant using LangGraph, Gemini, Groq, Deepgram, MongoDB, and RAG."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepgram-sdk>=3.0.0",
    "gradio>=5.0.0",
    "groq>=0.30.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-mongodb>=0.7.0",
    "langgraph>=0.2.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pymongo>=4.8.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"